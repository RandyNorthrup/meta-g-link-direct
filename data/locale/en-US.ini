KeepReady="Keep connected while OBS is open"
KeepReady.Desc="Connects to the glasses when OBS starts and stays connected with the camera off, so a glasses source starts in about a second instead of about ten. Uses the glasses' battery the whole time, and the Wi-Fi adapter above stays on the glasses' network, with no internet, until OBS closes."
