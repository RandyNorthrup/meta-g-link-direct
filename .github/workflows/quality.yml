name: Portable protocol checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-protocol:
    name: Portable parser sanitizers and development-tool security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and test portable protocol with ASan and UBSan
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --preset portable
          cmake --build --preset portable
          ctest --preset portable
      - name: Fetch integrity-pinned secret scanner
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/mgl-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/mgl-gitleaks gitleaks
      - name: Scan complete checked-out history
        run: /tmp/mgl-gitleaks/gitleaks git --redact --no-banner .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
      - name: Audit pinned development dependencies and detect duplication
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
          npx --no-install jscpd --config .jscpd.json --fail-on-empty
